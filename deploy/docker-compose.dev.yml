# Postgres for working on planaffe, and nothing else: `dotnet run --project
# src/Planaffe.Api` runs the server against it, with the connection string in
# appsettings.Development.json.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d

name: planaffe-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: planaffe
      POSTGRES_USER: planaffe
      POSTGRES_PASSWORD: planaffe
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "55432:5432"
    volumes:
      - planaffe-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planaffe -d planaffe"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "51025:1025"
      - "58025:8025"

volumes:
  planaffe-dev-db:
